name: Mise a jour et deploiement

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  update-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run build-data
      - name: Commit des donnees si elles ont change
        run: |
          if git diff --quiet -- data/sites.json && [ -z "$(git ls-files --others -- data/sites.json)" ]; then
            echo "Aucun changement"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sites.json
          git commit -m "chore: mise a jour des donnees"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.test.result == 'success' && needs.update-data.result != 'failure'
    needs: [test, update-data]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run build-site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
